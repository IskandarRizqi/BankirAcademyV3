<!DOCTYPE html>

<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Login — Bankir Academy</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/><style>
    :root{
      --primary:#6757D9;
      --primary-dark:#342A78;
      --primary-light:#F1EFFF;
      --secondary:#00B7A8;
      --secondary-dark:#087E76;
      --accent:#FFC95C;
      --navy:#17143D;
      --text:#44445B;
      --muted:#737388;
      --line:#E8E7F1;
      --white:#FFFFFF;
      --page:#FAFAFF;
      --success:#208A69;
      --danger:#C04A67;
      --shadow:0 22px 60px rgba(31,27,82,.10);
      --shadow-sm:0 12px 30px rgba(31,27,82,.08);
      --radius-xl:32px;
      --radius-lg:24px;
      --radius-md:18px;
      --container:1180px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:100px}
    body{
      margin:0;
      color:var(--text);
      background:var(--page);
      font-family:"Inter",Arial,sans-serif;
      line-height:1.7;
      overflow-x:hidden;
    }
    body.menu-open{overflow:hidden}
    img,svg{max-width:100%;display:block}
    a{color:inherit;text-decoration:none}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    h1,h2,h3,h4,p{margin-top:0}
    h1,h2,h3,h4{
      color:var(--navy);
      font-family:"Manrope",sans-serif;
      letter-spacing:-.025em;
    }
    .container{width:min(var(--container),calc(100% - 40px));margin-inline:auto}
    .section{padding:96px 0}
    .section-soft{background:linear-gradient(180deg,#F8F7FF 0%,#FFFFFF 100%)}
    .section-dark{color:#fff;background:var(--navy)}
    .section-dark h2,.section-dark h3,.section-dark h4{color:#fff}
    .section-head{max-width:760px;margin:0 auto 48px;text-align:center}
    .section-head.left{margin-left:0;text-align:left}
    .section-head h2{
      margin:14px 0 15px;
      font-size:clamp(31px,4vw,48px);
      line-height:1.14;
    }
    .section-head p{color:var(--muted);font-size:16px}
    .section-dark .section-head p{color:rgba(255,255,255,.68)}
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:9px;
      padding:7px 12px;
      color:var(--primary-dark);
      background:#fff;
      border:1px solid rgba(103,87,217,.17);
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      letter-spacing:.10em;
      text-transform:uppercase;
    }
    .eyebrow::before{
      content:"";
      width:8px;height:8px;border-radius:50%;
      background:var(--secondary);
      box-shadow:0 0 0 5px rgba(0,183,168,.12);
    }
    .section-dark .eyebrow{
      color:#fff;background:rgba(255,255,255,.08);
      border-color:rgba(255,255,255,.12);
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:48px;
      padding:0 21px;
      border:1px solid transparent;
      border-radius:13px;
      font-weight:750;
      transition:.22s ease;
    }
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{
      color:#fff;background:var(--primary);
      box-shadow:0 12px 28px rgba(103,87,217,.28);
    }
    .btn-primary:hover{background:#5747C8}
    .btn-secondary{color:#fff;background:var(--secondary)}
    .btn-light{color:var(--primary-dark);background:#fff}
    .btn-outline{
      color:var(--primary-dark);
      background:rgba(255,255,255,.75);
      border-color:#DCD9F0;
    }
    .btn-sm{min-height:42px;padding:0 17px;font-size:13px}
    .icon-arrow{font-size:18px;line-height:1}
    .tag{
      display:inline-flex;
      align-items:center;
      min-height:28px;
      padding:0 10px;
      color:var(--primary-dark);
      background:var(--primary-light);
      border-radius:999px;
      font-size:11px;
      font-weight:800;
    }

    /* Header */
    .site-header{
      position:fixed;top:0;left:0;right:0;z-index:100;
      background:rgba(255,255,255,.92);
      border-bottom:1px solid rgba(232,231,241,.86);
      backdrop-filter:blur(17px);
      transition:.25s ease;
    }
    .site-header.scrolled{box-shadow:0 9px 28px rgba(31,27,82,.08)}
    .header-inner{
      min-height:82px;
      display:flex;align-items:center;justify-content:space-between;gap:24px;
    }
    .brand{display:inline-flex;align-items:center;gap:12px;min-width:max-content}
    .brand-logo{width:49px;height:49px;filter:drop-shadow(0 10px 14px rgba(103,87,217,.20))}
    .brand-copy strong{
      display:block;color:var(--navy);
      font:800 19px/1.1 "Manrope",sans-serif;
    }
    .brand-copy small{
      display:block;margin-top:5px;color:var(--muted);
      font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    }
    .desktop-nav{display:flex;align-items:center;gap:4px}
    .nav-item{position:relative}
    .nav-link{
      display:flex;align-items:center;gap:6px;
      padding:12px 13px;
      color:#48475F;
      border-radius:10px;
      font-size:13px;font-weight:700;
      transition:.18s ease;
    }
    .nav-link:hover,.nav-link.active{color:var(--primary);background:var(--primary-light)}
    .chevron{font-size:10px;transition:.18s}
    .nav-item:hover .chevron{transform:rotate(180deg)}
    .dropdown{
      position:absolute;top:calc(100% + 12px);left:0;
      width:300px;padding:10px;
      background:#fff;border:1px solid var(--line);
      border-radius:18px;box-shadow:var(--shadow);
      opacity:0;visibility:hidden;transform:translateY(9px);
      transition:.18s ease;
    }
    .nav-item:hover .dropdown{opacity:1;visibility:visible;transform:translateY(0)}
    .dropdown.wide{width:680px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .drop-link{
      display:flex;gap:12px;padding:12px;
      border-radius:12px;transition:.18s;
    }
    .drop-link:hover{background:var(--primary-light)}
    .drop-icon{
      flex:0 0 auto;width:38px;height:38px;border-radius:11px;
      display:grid;place-items:center;
      color:var(--primary);background:#F3F1FF;font-size:17px;
    }
    .drop-link strong{display:block;color:var(--navy);font-size:13px}
    .drop-link span{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.45}
    .header-action{display:flex;align-items:center;gap:9px}
    .menu-toggle{
      display:none;width:45px;height:45px;
      border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);
    }

    /* Mobile menu */
    .mobile-panel{
      display:none;
      position:fixed;inset:82px 0 0;z-index:99;
      padding:18px 20px 35px;
      background:#fff;overflow:auto;
    }
    .mobile-panel.open{display:block}
    .mobile-group{border-bottom:1px solid var(--line)}
    .mobile-main{
      width:100%;display:flex;align-items:center;justify-content:space-between;
      padding:15px 4px;border:0;background:none;color:var(--navy);font-weight:800;text-align:left;
    }
    .mobile-sub{display:none;padding:0 0 12px 12px}
    .mobile-sub.open{display:grid}
    .mobile-sub a{padding:9px 8px;color:var(--muted);font-size:14px}
    .mobile-login{margin-top:20px;width:100%}

    /* Hero */
    .hero{
      position:relative;overflow:hidden;
      padding:156px 0 82px;
      background:
        radial-gradient(circle at 14% 23%,rgba(0,183,168,.14),transparent 27%),
        radial-gradient(circle at 87% 20%,rgba(255,201,92,.20),transparent 24%),
        linear-gradient(135deg,#F4F1FF 0%,#FFFFFF 52%,#EDFBF9 100%);
    }
    .hero::before{
      content:"";position:absolute;left:-110px;bottom:-145px;
      width:360px;height:360px;border:52px solid rgba(103,87,217,.055);border-radius:50%;
    }
    .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.06fr .94fr;gap:62px;align-items:center}
    .hero h1{
      margin:20px 0 19px;
      font-size:clamp(42px,5.4vw,69px);
      line-height:1.05;
    }
    .gradient-text{
      background:linear-gradient(90deg,var(--primary),var(--secondary-dark));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .hero-lead{max-width:690px;color:#626278;font-size:17px}
    .hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:29px}
    .hero-proof{display:flex;flex-wrap:wrap;gap:16px;margin-top:31px}
    .proof-item{display:flex;align-items:center;gap:9px;color:#5D5C72;font-size:12px;font-weight:700}
    .proof-icon{
      width:28px;height:28px;display:grid;place-items:center;
      color:var(--secondary-dark);background:#E9FAF7;border-radius:9px;
    }
    .hero-visual{position:relative;min-height:530px}
    .visual-main{
      position:absolute;inset:18px 6px 18px 40px;
      padding:22px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.95);
      border-radius:34px;box-shadow:var(--shadow);
      backdrop-filter:blur(15px);
    }
    .dashboard{
      height:100%;padding:22px;
      background:linear-gradient(150deg,#282162,#17143D);
      border-radius:25px;overflow:hidden;
    }
    .dash-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}
    .dash-brand{display:flex;align-items:center;gap:9px;color:#fff;font-size:12px;font-weight:800}
    .dash-dots{display:flex;gap:5px}
    .dash-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
    .dash-hero{
      padding:21px;background:linear-gradient(135deg,rgba(103,87,217,.62),rgba(0,183,168,.36));
      border:1px solid rgba(255,255,255,.12);border-radius:19px;
    }
    .dash-label{color:#D9D4FF;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .dash-hero h3{margin:8px 0 7px;color:#fff;font-size:25px;line-height:1.2}
    .dash-hero p{margin:0;color:rgba(255,255,255,.68);font-size:11px}
    .dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
    .dash-stat{padding:13px;background:rgba(255,255,255,.07);border-radius:13px}
    .dash-stat strong{display:block;color:#fff;font-size:16px}
    .dash-stat span{color:rgba(255,255,255,.55);font-size:9px}
    .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    .dash-card{padding:16px;background:#fff;border-radius:16px}
    .dash-card h4{margin-bottom:10px;font-size:12px}
    .progress{height:7px;background:#ECEAF6;border-radius:99px;overflow:hidden}
    .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:99px}
    .mini-list{display:grid;gap:8px}
    .mini-row{display:flex;align-items:center;gap:8px}
    .mini-row i{width:9px;height:9px;border-radius:3px;background:var(--secondary)}
    .mini-row span{font-size:9px;color:var(--muted)}
    .float-card{
      position:absolute;z-index:2;display:flex;align-items:center;gap:12px;
      padding:14px 17px;background:#fff;border:1px solid var(--line);
      border-radius:16px;box-shadow:var(--shadow-sm);
    }
    .float-card.one{left:0;top:88px}
    .float-card.two{right:-10px;bottom:75px}
    .float-card.three{left:10px;bottom:15px}
    .float-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--primary-light);color:var(--primary)}
    .float-card strong{display:block;color:var(--navy);font-size:12px}
    .float-card small{display:block;color:var(--muted);font-size:9px}

    /* Trust strip */
    .trust-strip{position:relative;z-index:3;margin-top:-1px;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .trust-inner{display:grid;grid-template-columns:1.15fr repeat(4,1fr);align-items:center;gap:20px;padding:25px 0}
    .trust-copy strong{display:block;color:var(--navy);font-size:13px}
    .trust-copy span{color:var(--muted);font-size:11px}
    .trust-item{display:flex;align-items:center;justify-content:center;gap:9px;color:#69677D;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
    .trust-mark{width:32px;height:32px;display:grid;place-items:center;color:var(--primary);background:var(--primary-light);border-radius:10px}

    /* Solution cards */
    .cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    .cards-2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
    .service-card{
      position:relative;overflow:hidden;
      min-height:310px;padding:28px;
      background:#fff;border:1px solid var(--line);
      border-radius:var(--radius-lg);box-shadow:0 12px 35px rgba(31,27,82,.055);
      transition:.25s ease;
    }
    .service-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
    .service-card::after{
      content:"";position:absolute;right:-45px;bottom:-50px;width:145px;height:145px;
      border:27px solid rgba(103,87,217,.055);border-radius:50%;
    }
    .card-icon{
      width:54px;height:54px;display:grid;place-items:center;
      color:var(--primary);background:var(--primary-light);
      border-radius:16px;font-size:24px;
    }
    .service-card:nth-child(2n) .card-icon{color:var(--secondary-dark);background:#E9FAF7}
    .service-card:nth-child(3n) .card-icon{color:#9A6C0F;background:#FFF6DE}
    .service-card h3{margin:21px 0 11px;font-size:21px}
    .service-card p{color:var(--muted);font-size:13px}
    .card-list{display:grid;gap:8px;margin:18px 0 20px;padding:0;list-style:none}
    .card-list li{display:flex;gap:9px;color:#55546A;font-size:12px}
    .card-list li::before{content:"✓";color:var(--secondary-dark);font-weight:900}
    .text-link{position:relative;z-index:2;color:var(--primary);font-size:12px;font-weight:800}
    .text-link:hover{text-decoration:underline}

    /* Split */
    .split{display:grid;grid-template-columns:1fr 1fr;gap:58px;align-items:center}
    .feature-visual{
      position:relative;min-height:520px;padding:33px;
      background:linear-gradient(145deg,#F0EDFF,#EAFBF8);
      border:1px solid #E2DFF7;border-radius:32px;
    }
    .feature-screen{
      position:absolute;inset:48px 32px 34px 57px;padding:22px;
      background:#fff;border:1px solid var(--line);border-radius:23px;box-shadow:var(--shadow);
    }
    .screen-nav{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
    .screen-title{font-size:11px;font-weight:800;color:var(--navy)}
    .screen-pill{padding:5px 9px;color:var(--secondary-dark);background:#E8FAF7;border-radius:99px;font-size:8px;font-weight:800}
    .chart-area{display:flex;align-items:flex-end;gap:10px;height:155px;padding:25px 10px 8px;border-bottom:1px solid var(--line)}
    .bar{flex:1;min-width:15px;background:linear-gradient(180deg,var(--primary),#9488EC);border-radius:7px 7px 2px 2px}
    .screen-bottom{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
    .screen-box{padding:14px;background:#FAFAFF;border:1px solid var(--line);border-radius:13px}
    .screen-box strong{display:block;color:var(--navy);font-size:19px}
    .screen-box span{color:var(--muted);font-size:9px}
    .feature-chip{
      position:absolute;display:flex;align-items:center;gap:9px;padding:12px 14px;
      background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);
    }
    .feature-chip.one{top:21px;right:18px}
    .feature-chip.two{left:12px;bottom:53px}
    .feature-chip i{width:32px;height:32px;display:grid;place-items:center;font-style:normal;color:var(--primary);background:var(--primary-light);border-radius:10px}
    .feature-chip strong{display:block;color:var(--navy);font-size:10px}
    .feature-chip span{display:block;color:var(--muted);font-size:8px}
    .feature-copy h2{margin:14px 0 16px;font-size:clamp(31px,4vw,48px);line-height:1.14}
    .feature-copy>p{color:var(--muted)}
    .feature-points{display:grid;gap:16px;margin:27px 0 30px}
    .feature-point{display:flex;gap:14px}
    .point-icon{flex:0 0 auto;width:39px;height:39px;display:grid;place-items:center;color:var(--secondary-dark);background:#E9FAF7;border-radius:12px;font-weight:900}
    .feature-point strong{display:block;color:var(--navy);font-size:13px}
    .feature-point span{display:block;margin-top:2px;color:var(--muted);font-size:11px}

    /* Innovation */
    .innovation-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:25px}
    .innovation-main{
      min-height:480px;padding:34px;
      color:#fff;background:linear-gradient(145deg,var(--primary-dark),var(--primary));
      border-radius:29px;overflow:hidden;position:relative;
    }
    .innovation-main h3{max-width:540px;margin:18px 0 14px;color:#fff;font-size:32px;line-height:1.17}
    .innovation-main p{max-width:610px;color:rgba(255,255,255,.74)}
    .innovation-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:23px}
    .innovation-tags span{padding:8px 11px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.13);border-radius:99px;font-size:10px;font-weight:800}
    .ai-orbit{position:absolute;right:-35px;bottom:-72px;width:330px;height:330px;border:1px solid rgba(255,255,255,.15);border-radius:50%}
    .ai-orbit::before,.ai-orbit::after{content:"";position:absolute;border:1px solid rgba(255,255,255,.12);border-radius:50%}
    .ai-orbit::before{inset:45px}.ai-orbit::after{inset:93px}
    .ai-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:83px;height:83px;display:grid;place-items:center;color:var(--primary-dark);background:#fff;border-radius:24px;font:800 25px "Manrope"}
    .orbit-dot{position:absolute;width:36px;height:36px;display:grid;place-items:center;color:#fff;background:var(--secondary);border-radius:12px;font-size:13px}
    .orbit-dot.a{left:39px;top:57px}.orbit-dot.b{right:18px;top:115px}.orbit-dot.c{left:72px;bottom:27px}
    .innovation-side{display:grid;gap:20px}
    .example-card{padding:25px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-sm)}
    .example-head{display:flex;align-items:center;justify-content:space-between;gap:15px}
    .example-head h3{margin:0;font-size:18px}
    .example-card p{margin:12px 0 15px;color:var(--muted);font-size:12px}
    .example-meta{display:flex;flex-wrap:wrap;gap:7px}
    .example-meta span{padding:6px 9px;color:#65637A;background:#F5F4FA;border-radius:8px;font-size:9px;font-weight:750}

    /* Foundation */
    .foundation-card{
      position:relative;overflow:hidden;padding:33px;
      background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow-sm);
    }
    .foundation-card.education{background:linear-gradient(145deg,#FFFFFF,#F3F0FF)}
    .foundation-card.umkm{background:linear-gradient(145deg,#FFFFFF,#EBFAF7)}
    .foundation-card h3{margin:19px 0 11px;font-size:27px}
    .foundation-card p{color:var(--muted);font-size:13px}
    .foundation-programs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:24px 0}
    .program-mini{padding:13px;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:13px}
    .program-mini strong{display:block;color:var(--navy);font-size:11px}
    .program-mini span{display:block;margin-top:3px;color:var(--muted);font-size:9px}

    /* Journey */
    .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    .step{
      position:relative;padding:25px 22px;background:#fff;border:1px solid var(--line);border-radius:20px;
    }
    .step-no{
      width:41px;height:41px;display:grid;place-items:center;
      color:#fff;background:var(--primary);border-radius:13px;font-weight:800;
    }
    .step h3{margin:17px 0 8px;font-size:17px}
    .step p{color:var(--muted);font-size:11px}
    .step:not(:last-child)::after{
      content:"→";position:absolute;right:-17px;top:32px;z-index:3;color:#B3AEE2;font-size:22px;font-weight:900;
    }

    /* Curriculum */
    .curriculum-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:30px}
    .tab-btn{
      min-height:41px;padding:0 15px;border:1px solid var(--line);border-radius:11px;
      color:var(--muted);background:#fff;font-size:11px;font-weight:800;
    }
    .tab-btn.active{color:#fff;background:var(--primary);border-color:var(--primary)}
    .curriculum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .curriculum-item{padding:21px;background:#fff;border:1px solid var(--line);border-radius:17px}
    .curriculum-item .num{color:var(--primary);font-size:10px;font-weight:900}
    .curriculum-item h3{margin:8px 0 7px;font-size:15px;line-height:1.35}
    .curriculum-item p{margin:0;color:var(--muted);font-size:10px}

    /* App */
    .app-wrap{
      position:relative;overflow:hidden;
